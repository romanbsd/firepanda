name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release
      - name: MCP protocol gate
        run: python3 tests/protocol.py target/release/firepanda
      - name: Adversarial CDP transport gate
        run: python3 tests/transport.py target/release/firepanda
      - run: python3 scripts/install-lightpanda.py --release 1.0.2
      - name: Raw fetch gate
        run: python3 tests/fetch.py target/release/firepanda "$PWD/.local/bin/lightpanda"
      - name: Offline search gate
        run: python3 tests/search.py target/release/firepanda "$PWD/.local/bin/lightpanda"
      - name: Native integration gate
        run: python3 tests/integration.py target/release/firepanda "$PWD/.local/bin/lightpanda"
      - name: Memory and descriptor hygiene gate
        run: python3 tests/memory.py target/release/firepanda "$PWD/.local/bin/lightpanda"
      - name: Verify release packaging
        run: |
          python3 scripts/package-release.py --binary target/release/firepanda --output "$PWD/dist-check"
          test -f "$PWD/dist-check/firepanda-"*.tar.gz
