name: Bump FetchContent tags
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: bump-fetchcontent-tags
  cancel-in-progress: false
jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Bump GIT_TAG lines in CMakeLists.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/bump_fetchcontent_tags.py
      # GITHUB_TOKEN-created PR workflows may require maintainer approval. Test
      # the candidate here so dependency updates are validated before opening a PR.
      - name: Validate candidate dependencies
        run: |
          python3 scripts/install-lightpanda.py --release 1.0.2
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFIREPANDA_TEST_LIGHTPANDA="$PWD/.local/bin/lightpanda"
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: bump FetchContent dependency tags'
          title: 'chore: bump FetchContent dependency tags'
          branch: bump-fetchcontent-tags
          delete-branch: true
          add-paths: CMakeLists.txt
          body: |
            Updates the tagged C++ dependencies declared with FetchContent.
            The updater workflow builds and runs the complete suite before opening this PR.
            Review API compatibility before merging; no automatic merge is enabled.
