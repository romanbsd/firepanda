name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            os: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            host: aarch64-unknown-linux-gnu
          - platform: macos-arm64
            os: macos-15
            host: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify native build target
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          rustc --version --verbose | grep -Fx "host: $EXPECTED_HOST"
      - name: Build and test
        run: |
          cargo build --release --locked
          cargo test --release --locked
          python3 scripts/install-lightpanda.py --release 1.0.4
          python3 tests/protocol.py target/release/firepanda
          python3 tests/transport.py target/release/firepanda
          python3 tests/fetch.py target/release/firepanda "$PWD/.local/bin/lightpanda"
          python3 tests/integration.py target/release/firepanda "$PWD/.local/bin/lightpanda"
          python3 tests/memory.py target/release/firepanda "$PWD/.local/bin/lightpanda"
          python3 tests/search.py target/release/firepanda "$PWD/.local/bin/lightpanda"
      - name: Package binary, licenses and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package-release.py --binary target/release/firepanda --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --draft --verify-tag \
            --title "Firepanda $RELEASE_TAG" --generate-notes
