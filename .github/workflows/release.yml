name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test
        run: |
          cargo build --manifest-path rust/Cargo.toml --release --features search
          cargo test --manifest-path rust/Cargo.toml --release --features search
          python3 scripts/install-lightpanda.py --release 1.0.2
          python3 tests/protocol.py rust/target/release/firepanda
          python3 tests/transport.py rust/target/release/firepanda
          python3 tests/fetch.py rust/target/release/firepanda "$PWD/.local/bin/lightpanda"
          python3 tests/integration.py rust/target/release/firepanda "$PWD/.local/bin/lightpanda"
          python3 tests/memory.py rust/target/release/firepanda "$PWD/.local/bin/lightpanda"
          python3 tests/search.py rust/target/release/firepanda "$PWD/.local/bin/lightpanda"
      - name: Package binary, licenses and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/package-release.py --binary rust/target/release/firepanda --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --draft --verify-tag \
            --title "Firepanda $RELEASE_TAG" --generate-notes
