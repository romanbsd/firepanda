[package]
name = "firepanda"
version = "0.2.0"
edition = "2024"

# Parity contract: tests/protocol.py, tests/transport.py, tests/integration.py and
# tests/memory.py run this binary black-box over stdio (see docs/rust-migration-plan.md).

[features]
default = []
search = ["dep:scraper", "dep:url"]

[dependencies]
base64 = "0.23"
futures-util = { version = "0.3", features = ["sink"] }
libc = "0.2.191"
primp = "2.0.1"
scraper = { version = "0.29.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "io-std",
    "signal",
    "sync",
    "time",
    "net",
    "process",
] }
tokio-tungstenite = "0.30.0"
url = { version = "2", optional = true }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"

[[bin]]
name = "firepanda"
path = "src/main.rs"

[profile.release]
debug = false
# Packaging favors a small binary: symbols are not part of the archive.
strip = "symbols"
