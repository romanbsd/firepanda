[package]
name = "firepanda"
version = "0.2.0"
edition = "2024"

# Parity contract: tests/protocol.py, tests/transport.py, tests/integration.py and
# tests/memory.py run this binary black-box over stdio (see docs/rust-migration-plan.md).

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "io-std",
    "signal",
    "sync",
    "time",
    "net",
    "process",
] }

[[bin]]
name = "firepanda"
path = "src/main.rs"

[profile.release]
debug = false
